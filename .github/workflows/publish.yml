name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to publish (leave empty for all changed)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Get changed packages
        id: changed
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo "filter=--filter @polly-ts/${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            # Get packages changed since last commit on main
            CHANGED=$(pnpm ls -r --depth -1 --json | jq -r '.[].name' | while read pkg; do
              pkg_path=$(echo "$pkg" | sed 's/@polly-ts\//packages\//')
              if git diff --quiet HEAD^ -- "$pkg_path" 2>/dev/null; then
                :
              else
                echo "$pkg"
              fi
            done | tr '\n' ' ')

            if [ -n "$CHANGED" ]; then
              FILTER=$(echo "$CHANGED" | xargs -n1 | sed 's/^/--filter /' | tr '\n' ' ')
              echo "filter=$FILTER" >> $GITHUB_OUTPUT
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "Changed packages: $CHANGED"
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "No packages changed"
            fi
          fi

      - name: Check package versions against registry
        id: versions
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          PACKAGES_TO_PUBLISH=""

          for pkg_dir in packages/*/; do
            pkg_name=$(jq -r '.name' "$pkg_dir/package.json")
            pkg_version=$(jq -r '.version' "$pkg_dir/package.json")

            # Check if this version already exists on npm
            if npm view "$pkg_name@$pkg_version" version 2>/dev/null; then
              echo "$pkg_name@$pkg_version already published, skipping"
            else
              echo "$pkg_name@$pkg_version needs publishing"
              PACKAGES_TO_PUBLISH="$PACKAGES_TO_PUBLISH --filter $pkg_name"
            fi
          done

          if [ -n "$PACKAGES_TO_PUBLISH" ]; then
            echo "filter=$PACKAGES_TO_PUBLISH" >> $GITHUB_OUTPUT
            echo "has_publishable=true" >> $GITHUB_OUTPUT
          else
            echo "has_publishable=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish packages
        if: steps.versions.outputs.has_publishable == 'true'
        run: pnpm publish -r ${{ steps.versions.outputs.filter }} --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
